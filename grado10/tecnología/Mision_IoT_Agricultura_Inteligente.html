<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión IoT: Agricultura Inteligente</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#e0f2fe,#ecfccb);margin:0}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
h1{text-align:center;color:#166534}
.progress{height:20px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:0%;background:#22c55e;transition:.4s}
.option{display:block;margin:10px 0;padding:12px;background:#f3f4f6;border-radius:10px;cursor:pointer}
.option:hover{background:#dbeafe}
button{padding:12px 18px;border:none;border-radius:10px;background:#2563eb;color:white;cursor:pointer}
#feedback{margin-top:15px;font-weight:bold}
#result{display:none;text-align:center}
.badge{font-size:24px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🌱 Misión IoT: Agricultura Inteligente</h1>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button id="nextBtn" disabled>Siguiente</button>
<div id="result">
<h2>🎉 Resultado Final</h2>
<p id="scoreText"></p>
<div id="badge" class="badge"></div><br><br>
<button onclick="location.reload()">Jugar nuevamente</button>
</div>
</div>
</div>

<script>
const questions=[
["¿Cuál es uno de los principales desafíos que enfrenta la agricultura moderna?",["La falta de maquinaria","El cambio climático","El exceso de agua","La disminución de la población"],1],
["¿Qué significa IoT?",["Internet de los Trabajadores","Integración Operativa Tecnológica","Internet de las Cosas","Innovación Organizacional Tecnológica"],2],
["¿Qué dispositivos son los protagonistas del IoT agrícola?",["Tractores","Computadores","Sensores","Satélites"],2],
["Los sensores recopilan información sobre:",["Suelo, cultivos y clima","Mercados internacionales","Redes sociales","Precios agrícolas"],0],
["Las decisiones deben tomarse basadas en:",["Intuición","Costumbres","Datos","Opiniones"],2],
["¿Por qué el riego automático ayuda a la sostenibilidad?",["Aumenta el consumo de agua","Se ajusta a las condiciones del suelo","Funciona solo de noche","Elimina sensores"],1],
["¿Qué beneficio genera optimizar fertilizantes?",["Más contaminación","Menor producción","Suelos más saludables y mayor rendimiento","Mayor gasto"],2],
["¿Cómo ayudan los sensores frente a plagas?",["Las eliminan automáticamente","Las detectan tempranamente","Sustituyen cultivos","Aumentan temperatura"],1],
["¿Cuál es un desafío en zonas rurales?",["Exceso de conectividad","Falta de conectividad adecuada","Exceso de sensores","Falta de cultivos"],1],
["¿Cuál NO aparece como solución?",["Subvenciones","Conectividad rural","Eliminar internet","Colaboración tecnológica"],2],
["¿Qué ventaja tienen los sensores de humedad?",["Permiten regar según necesidades reales","Crean lluvia","Eliminan plagas","Reducen cultivos"],0],
["¿Para qué sirven sensores en ganadería?",["Aumentar peso","Detectar enfermedades","Reducir animales","Medir velocidad"],1],
["¿Por qué IoT aumenta productividad?",["Reemplaza agricultores","Permite actuar con información precisa","Elimina cultivos","Reduce fincas"],1],
["Según el video, el futuro será:",["Menos tecnológico","Más dependiente del azar","Más eficiente, rentable y sostenible","Igual al pasado"],2],
["¿Cuál es la idea principal del video?",["Reemplazar agricultores","Sensores poco útiles","El IoT mejora productividad y sostenibilidad mediante datos","La agricultura ya no será necesaria"],2]
];

let current=0,score=0,answered=false;
const qEl=document.getElementById('question');
const oEl=document.getElementById('options');
const fEl=document.getElementById('feedback');
const nBtn=document.getElementById('nextBtn');

function sound(ok){
try{
let a=new(window.AudioContext||window.webkitAudioContext)();
let o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=ok?700:250;o.start();
setTimeout(()=>{o.stop();a.close()},150);
}catch(e){}
}

function loadQ(){
answered=false;nBtn.disabled=true;
let q=questions[current];
qEl.textContent=(current+1)+". "+q[0];
oEl.innerHTML="";
q[1].forEach((txt,i)=>{
let d=document.createElement('div');
d.className='option'; d.textContent=txt;
d.onclick=()=>answer(i);
oEl.appendChild(d);
});
fEl.textContent="";
document.getElementById('bar').style.width=(current/questions.length*100)+'%';
}

function answer(i){
if(answered)return;
answered=true;
let q=questions[current];
let opts=document.querySelectorAll('.option');
opts[q[2]].style.background='#86efac';
if(i===q[2]){score++;fEl.textContent='✅ Correcto';sound(true);}
else{opts[i].style.background='#fca5a5';fEl.textContent='❌ Incorrecto';sound(false);}
nBtn.disabled=false;
}

nBtn.onclick=()=>{
current++;
if(current<questions.length) loadQ();
else finish();
};

function finish(){
qEl.style.display='none';oEl.style.display='none';fEl.style.display='none';nBtn.style.display='none';
document.getElementById('result').style.display='block';
document.getElementById('scoreText').innerHTML='Obtuviste <b>'+score+'</b> de '+questions.length+' puntos.';
let badge='';
if(score<=5) badge='🌱 Aprendiz Novato';
else if(score<=10) badge='🚜 Agricultor Digital';
else if(score<=13) badge='📡 Experto en IoT';
else badge='🏆 Maestro de la Agricultura Inteligente';
document.getElementById('badge').textContent=badge;
document.getElementById('bar').style.width='100%';
}

loadQ();
</script>
</body>
</html>
